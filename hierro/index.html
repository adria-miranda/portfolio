<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hierro · Demo</title>
<meta name="description" content="Hierro: app para apuntar entrenos de gimnasio, ver el progreso y compararse con amigos. Demo con datos de ejemplo. Proyecto de Adrià Miranda.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C9232E'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='white' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#F5F6F8; --bg-glow:#F5F6F8; --surface:#FFFFFF; --surface-2:#EFF1F4; --ink:#181A1F; --muted:#60656F; --line:#E3E5EA;
  --accent:#C9232E; --accent-ink:#FFFFFF; --accent-soft:#FBE3E4;
  --hero-a:#D42A36; --hero-b:#7A101B;
  --done:#14855A; --done-soft:#DDF1E7; --danger:#B3202A;
  --pr:#946600; --pr-soft:#F8EBC7; --warn:#946800; --warn-soft:#F6EAC6; --plate:#D9A000;
  --scrim:rgba(17,19,23,.45); --timer-fill:#D9A000;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --bg-glow:#111315; --surface:#1B1E24; --surface-2:#23272F; --ink:#F4F5F7; --muted:#A4AAB5; --line:#2E333C;
    --accent:#FF5F69; --accent-ink:#1A0A0C; --accent-soft:#3A1F24;
    --done:#43C98F; --done-soft:#17352A; --danger:#FF6B73;
    --pr:#F2C14A; --pr-soft:#3A3117; --warn:#F2C14A; --warn-soft:#3A3117; --plate:#F2C14A;
    --scrim:rgba(0,0,0,.6); --timer-fill:#FF5F69; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --bg-glow:#111315; --surface:#1B1E24; --surface-2:#23272F; --ink:#F4F5F7; --muted:#A4AAB5; --line:#2E333C;
    --accent:#FF5F69; --accent-ink:#1A0A0C; --accent-soft:#3A1F24;
    --done:#43C98F; --done-soft:#17352A; --danger:#FF6B73;
    --pr:#F2C14A; --pr-soft:#3A3117; --warn:#F2C14A; --warn-soft:#3A3117; --plate:#F2C14A;
    --scrim:rgba(0,0,0,.6); --timer-fill:#FF5F69; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg) linear-gradient(180deg,var(--bg-glow) 0,var(--bg) 560px) no-repeat;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%}
h1,h2,h3,p{margin:0}
.app{max-width:560px;margin:0 auto;padding:18px 16px 104px}
body.focus .app{padding-bottom:40px}
body.focus.timer-on .app{padding-bottom:120px}
.meta{color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.h2{font-family:var(--display);font-weight:800;font-size:38px;line-height:.95;letter-spacing:.005em}
.h2.sm{font-size:28px}
.h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;margin:22px 0 10px}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:600;font-size:16px}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-size:17px}
.btn-ghost{border:1px solid var(--line);background:var(--surface)}
.btn-text{min-height:44px;color:var(--muted);font-weight:500}
.danger{color:var(--danger)}
.wide{width:100%;margin-top:10px}
.row-btns{display:flex;gap:8px;margin-top:12px}
.row-btns .btn{flex:1}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}

/* today */
.hero,.page-head{position:relative;color:#FFFFFF;margin:-18px -16px 18px;padding:24px 16px 16px;border-radius:0 0 26px 26px;overflow:hidden;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20200%20200%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%270.15%27%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2793%27%20stroke-width%3D%2712%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2768%27%20stroke-width%3D%273%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2746%27%20stroke-width%3D%272%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2722%27%20stroke-width%3D%2712%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat right -72px top -64px / 236px 236px,url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20200%20200%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%270.15%27%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2793%27%20stroke-width%3D%2712%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2768%27%20stroke-width%3D%273%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2746%27%20stroke-width%3D%272%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2722%27%20stroke-width%3D%2712%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat left -54px bottom -96px / 160px 160px,linear-gradient(150deg,var(--hero-a) 0%,var(--hero-b) 100%)}
#banner:not(:empty) ~ main .hero,#banner:not(:empty) ~ main .page-head,#banner:not(:empty) ~ main .wk-head{margin-top:0;border-radius:26px}
body{overflow-x:clip}
.hero,.page-head{--gut:max(16px, calc((100vw - 560px) / 2 + 16px));margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:calc(50vw - 50%);padding-right:calc(50vw - 50%);background-position:right calc(var(--gut) - 88px) top -64px,left calc(var(--gut) - 70px) bottom -96px,0 0}
.today-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.today-head h1{font-family:var(--display);font-weight:800;font-size:clamp(54px,17vw,80px);line-height:.82;letter-spacing:-.005em}
.today-head .date{color:rgba(255,255,255,.82);font-size:15px;text-align:right;padding-bottom:4px}
.hero .week{margin-bottom:0}
.hero .wd{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.hero .wd span{color:rgba(255,255,255,.78)}
.hero .wd.is-today{border-color:#FFFFFF}
.hero .wd.is-done,.hero .wd.is-done.is-today{background:#FFFFFF;border-color:#FFFFFF;color:var(--hero-b)}
.hero .wd.is-done span{color:var(--hero-b)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:18px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 1px 8px;text-align:center;min-width:0}
.wd b{display:block;font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1}
.wd span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.wd.is-today{border-color:var(--ink);border-width:2px;padding:6px 0 7px}
.wd.is-done{background:var(--done-soft);border-color:transparent}
.wd.is-done.is-today{border-color:var(--done)}
.wd.is-done span{color:var(--done);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.session .h2{margin:6px 0 6px}
.session.live{border-color:var(--accent);border-width:2px}
.ex-preview{list-style:none;padding:0;margin:16px 0 18px;display:grid;gap:7px}
.ex-preview li{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding-bottom:7px;border-bottom:1px dashed var(--line)}
.ex-preview li:last-child{border-bottom:0;padding-bottom:0}
.ex-preview .num{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
.session .btn-primary{width:100%}
.others{margin-top:6px}
.other-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:8px}
.other-row strong{display:block;font-weight:600}
.other-row .go{margin-left:auto;font-size:14px;font-weight:600;color:var(--accent);white-space:nowrap}
.last-card{margin-top:22px;padding:14px 16px;border-radius:16px;background:var(--surface-2)}
.last-card strong{font-weight:600}

/* workout */
.wk-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:#FFFFFF;display:flex;align-items:center;gap:10px;margin:-18px -16px 14px;padding:12px 16px}
.wk-head .meta{color:rgba(255,255,255,.8)}
.wk-head .icon-btn{background:rgba(255,255,255,.16);color:#FFFFFF}
.wk-head .date-in{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#FFFFFF;color-scheme:dark}
.wk-head .title-in{color:#FFFFFF;border-bottom-color:rgba(255,255,255,.45)}
.wk-head .title-in::placeholder{color:#FFFFFF;opacity:.6}
.wk-head{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:calc(50vw - 50%);padding-right:calc(50vw - 50%)}
.wk-title{flex:1;min-width:0}
.wk-title h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-in{height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 8px;font-size:14px;max-width:150px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 14px 10px;margin-bottom:12px}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-family:var(--display);font-weight:700;font-size:25px;line-height:1}
.ex-target{font-family:var(--display);font-weight:700;font-size:19px;color:var(--muted);white-space:nowrap;line-height:1.2}
.last{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.last-lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
.chip{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{margin:10px 0 10px;font-size:14px;padding:8px 11px;border-radius:12px;background:var(--surface-2)}
.hint.up{background:var(--accent-soft)}
.hint.hold{background:var(--warn-soft)}
.sets-head,.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 50px 54px;gap:7px;align-items:center}
.sets-head{font-size:12px;color:var(--muted);padding-bottom:2px}
.sets-head span:nth-child(2),.sets-head span:nth-child(3),.sets-head span:nth-child(5){text-align:center}
.sets-head span:nth-child(5){font-size:11px}
.set{padding:4px 0}
.set .n{font-family:var(--display);font-weight:700;font-size:21px;color:var(--muted);text-align:center}
.in{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 4px;-webkit-appearance:none;appearance:none}
.in::placeholder{color:var(--muted);opacity:.38}
.set.done .in{background:var(--done-soft);border-color:transparent}
.set.dropset .in{height:42px;font-size:22px}
.drop-btn{height:48px;border-radius:12px;border:1px dashed var(--line);font-size:11.5px;line-height:1.15;padding:0 3px;color:var(--muted)}
.drop-btn.on{border-style:solid;border-color:var(--ink);color:var(--ink)}
.plate{width:54px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;transition:background-color .15s,border-color .15s}
.plate svg{width:24px;height:24px}
.set.done .plate{background:var(--done);border-color:var(--done);color:#FFFFFF}
.ex-foot{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mini{font-size:14px;padding:8px 12px;border-radius:10px;color:var(--muted)}
.mini:hover{background:var(--surface-2)}
.note-in{width:100%;min-height:64px;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;resize:vertical;font-size:15px}
.ss{position:relative;padding-left:14px;margin-bottom:4px}
.ss::before{content:"";position:absolute;left:0;top:30px;bottom:16px;width:4px;border-radius:4px;background:var(--accent)}
.ss-label{font-size:13px;font-weight:600;color:var(--accent);margin:0 0 6px}
.finish{width:100%;margin-top:16px;min-height:56px;font-size:18px}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.timer[hidden]{display:none}
.timer-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer .t{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:92px}
.t-mid{flex:1;min-width:0}
.t-lbl{font-size:13px;opacity:.8}
.t-track{height:6px;border-radius:6px;background:rgba(127,127,127,.35);margin-top:6px;overflow:hidden}
.t-track i{display:block;height:100%;width:0;background:var(--timer-fill);border-radius:6px}
.t-btn{min-width:46px;height:42px;border-radius:12px;border:1px solid rgba(127,127,127,.45);font-size:14px;font-weight:600;padding:0 8px}
.timer.is-done{background:var(--plate);color:#14181D}
.timer.is-done .t-track{background:rgba(20,24,29,.2)}
.timer.is-done .t-track i{background:#14181D}
.timer.is-done .t-btn{border-color:rgba(20,24,29,.4)}
.timer.is-done .adj{display:none}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--muted)}
.nav button{position:relative}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav svg{width:25px;height:25px}
body.focus .nav{display:none}

/* pages */
.page-head{padding:30px 16px 20px}
.page-head .link-btn{color:#FFFFFF}
.page-head h1{font-family:var(--display);font-weight:800;font-size:56px;line-height:.85}
.big-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}
.ex-chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.ex-chips::-webkit-scrollbar{display:none}
.ex-chip{flex:none;white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.ex-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin:12px 0 10px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent-soft);opacity:.75}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.best{fill:var(--pr);stroke:var(--pr)}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.caption{font-size:12.5px;color:var(--muted);margin-top:4px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.trio b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.trio span{font-size:12.5px;color:var(--muted)}
.up-c{color:var(--done)}
.down-c{color:var(--danger)}
.best-line{font-size:14px;margin-top:10px}
.log-row{padding:10px 0;border-bottom:1px dashed var(--line)}
.log-row:last-child{border-bottom:0}
.log-row .d{font-size:13px;color:var(--muted);margin-bottom:5px}
.log-row .last{margin-top:0}
.empty p{margin:6px 0 16px;color:var(--muted)}
.empty .btn{width:100%}

/* history */
.hist-month{font-family:var(--display);font-weight:700;font-size:24px;margin:18px 0 8px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.hist-row{display:flex;width:100%;text-align:left;padding:12px 14px;gap:14px;align-items:center}
.hist-date{width:40px;text-align:center;flex:none}
.hist-date b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:.9}
.hist-date span{font-size:12px;color:var(--muted)}
.hist-body{flex:1;min-width:0;display:grid}
.hist-body strong{font-weight:600}
.chev{color:var(--muted);transition:transform .15s}
.hist.open .chev{transform:rotate(180deg)}
.hist-detail{padding:4px 14px 14px;border-top:1px dashed var(--line)}
.hd-ex{padding:10px 0 2px}
.hd-name{font-weight:600;font-size:15px}
.hd-ex .last{margin-top:6px}
.hd-note{font-size:13.5px;color:var(--muted);margin-top:6px}

/* routine */
.day-row{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:8px}
.dr-wd{font-size:13px;color:var(--muted)}
.dr-name{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:2px 0 4px}
.day-row .meta{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.txt{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;width:100%;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.item-top{display:flex;gap:6px;align-items:center}
.item-name{flex:1;min-width:0;text-align:left;font-weight:600;line-height:1.25;padding:4px 0}
.item-name small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.item .icon-btn{width:36px;height:36px;border-radius:10px}
.item-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.item-grid label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.small-in{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;width:100%;padding:0 4px;font-size:15px;-webkit-appearance:none;appearance:none}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.pick{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15.5px}
.pick small{color:var(--muted);font-size:12.5px;margin-left:6px}
#exlist{margin:8px 0 6px;max-height:46vh;overflow:auto}
.new-ex{margin-top:6px;padding-top:4px}
.sum-list{list-style:none;padding:0;margin:14px 0 18px}
.sum-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sum-list .nm{font-weight:600;font-size:15px}
.sum-list .bs{grid-column:1;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum-list .dl{grid-column:2;grid-row:1 / span 2;align-self:center;font-family:var(--display);font-weight:800;font-size:22px}
.sum-list .is-pr .nm::after{content:"Récord";margin-left:8px;font-size:11.5px;font-weight:700;color:var(--pr);background:var(--pr-soft);padding:2px 7px;border-radius:999px;vertical-align:2px}
.pr-line{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--pr-soft);color:var(--pr);font-weight:600}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
body.timer-on .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* liga */
.page-head.split{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.link-btn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.join{border:2px solid var(--accent);margin-bottom:18px}
.join .row{display:flex;gap:8px;margin-top:12px}
.join .txt{flex:1;min-width:0}
.join .btn-text{margin-top:4px;min-height:36px}
.list-card{padding:0;overflow:hidden}
.rank{list-style:none;padding:0;margin:0}
.rank li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}
.rank li.me{background:var(--accent-soft)}
.rank .pos{font-family:var(--display);font-weight:800;font-size:24px;width:20px;text-align:center;color:var(--muted);flex:none}
.rank li.first .pos{color:var(--plate)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.28)}
.rank .who{flex:1;min-width:0;display:grid}
.rank .who strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .val{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:block;height:6px;border-radius:6px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.feed{list-style:none;padding:0;margin:0}
.feed li{padding:11px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.feed li:first-child{padding-top:0}
.feed li:last-child{border-bottom:0;padding-bottom:0}
.feed .when{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.feed .pr{color:var(--pr);font-weight:600}
.cat-h{font-size:13px;color:var(--muted);margin:14px 0 0;font-weight:600}
.invite{background:var(--surface-2);border-radius:16px;padding:14px 16px;margin:4px 0 12px;font-size:14.5px}
.people{display:flex;gap:14px;overflow-x:auto;margin:0 -16px 4px;padding:6px 16px 8px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;position:relative;display:grid;justify-items:center;gap:5px;width:60px;font-size:12.5px}
.person .nm{max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.person[aria-pressed="true"] .nm{font-weight:700}
.av.lg{width:48px;height:48px;font-size:19px}
.all-av{background:var(--surface-2);color:var(--ink)}
.cnt{position:absolute;top:-4px;right:0;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px 16px;margin-bottom:10px}
.post-head{display:flex;align-items:center;gap:10px}
.post-who{display:grid;line-height:1.3}
.post-who strong{font-weight:600}
.post-title{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:12px 0 2px}
.pe{padding-top:11px}
.pe-name{font-weight:600;font-size:15px}
.pe-name small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.pe .last{margin-top:6px}
.badge{margin-left:8px;font-size:11.5px;font-weight:700;color:var(--pr);background:var(--pr-soft);padding:2px 7px;border-radius:999px;vertical-align:2px}
.prof{margin-bottom:6px}
.prof-top{display:flex;align-items:center;gap:12px}
.bests{list-style:none;padding:0;margin:0}
.bests li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.bests li:last-child{border-bottom:0;padding-bottom:0}
.bests .num{font-weight:600;white-space:nowrap}
.title-in{width:100%;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;border:0;border-bottom:2px solid var(--line);background:transparent;padding:2px 0;border-radius:0}
.title-in::placeholder{color:var(--muted);opacity:.6}
.cmp{padding:2px 16px}
.cmp-row{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border-bottom:0}
.cmp-top{display:flex;align-items:center;gap:10px}
.cmp-nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-row.me .cmp-nm::after{content:" (tú)";font-weight:400;color:var(--muted)}
.cmp-val{font-family:var(--display);font-weight:800;font-size:25px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmp-meta{font-size:12.5px;color:var(--muted);margin:3px 0 0 46px}
.cmp .bar{height:8px;margin:8px 0 0 46px}
.cmp-row.first .bar i{background:var(--plate)}
.back-link{display:inline-flex;align-items:center;gap:4px;margin:0 0 12px}
.ex-pick-wrap{position:relative;margin-bottom:12px}
.ex-pick-wrap::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ex-pick{width:100%;height:54px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 44px 0 16px;font-family:var(--display);font-weight:700;font-size:23px;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none}
.ex-pick optgroup,.ex-pick option{font-family:var(--body);font-size:16px;font-weight:400}
.prog .seg{margin-top:0}
.pick-trigger{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px 12px 16px;margin-bottom:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.pt-txt{flex:1;min-width:0;display:grid}
.pt-lbl{font-size:12.5px;color:var(--muted)}
.pt-name{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-ico{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#picklist{margin:6px -6px 0;max-height:58vh;overflow:auto}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;border-radius:14px}
.prow + .prow{margin-top:2px}
.prow:hover{background:var(--surface-2)}
.prow[aria-current="true"]{background:var(--accent-soft)}
.prow-txt{flex:1;min-width:0;display:grid}
.prow-nm{font-weight:600;font-size:15.5px}
.prow-sub{font-size:13px;color:var(--muted)}
.delta{font-family:var(--display);font-weight:800;font-size:18px;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap}
.delta.up{color:var(--done);background:var(--done-soft)}
.delta.down{color:var(--danger);background:var(--surface-2)}
.delta.eq{color:var(--muted);background:var(--surface-2)}
.toast.has-act{display:flex;align-items:center;gap:14px;white-space:nowrap}
.toast.show.has-act{pointer-events:auto}
.toast-act{font-weight:700;text-decoration:underline;padding:4px 2px;color:inherit}
.session .btn-primary{margin-top:14px}
.session .ex-preview{margin:18px 0 0}
.trio b small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.first-mark{padding:6px 0 2px}
.first-mark b{display:block;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:6px 0 4px}
.ex-more{width:36px;height:36px;border-radius:10px;margin:-4px -4px 0 0}
.ex-top .ex-target{margin-left:auto}
.ex-folded{padding:12px 14px}
.ex-fold{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.ex-folded .ex-name{font-size:22px}
.fold-badge{display:inline-flex;align-items:center;gap:4px;flex:none;font-weight:700;font-size:14px;color:var(--done);background:var(--done-soft);border-radius:999px;padding:4px 10px}
.fold-badge svg{width:16px;height:16px}
.ex-folded .last{margin-top:8px}
.menu-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 8px;border-bottom:1px solid var(--line);font-size:16px}
.menu-btn:last-child{border-bottom:0}
.menu-btn:disabled{opacity:.4}
.menu-btn svg{width:20px;height:20px;color:var(--muted);flex:none}
.sheet-btns{display:grid;gap:8px;margin-top:14px}
.t-lbl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.t-go{display:none}
body:not(.focus) .t-go{display:inline-flex;align-items:center;justify-content:center}
body:not(.focus) .timer .adj{display:none}
body:not(.focus) .timer{bottom:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
body:not(.focus) .timer .t{font-size:36px;min-width:78px}
body.timer-on:not(.focus) .app{padding-bottom:180px}
body.timer-on:not(.focus) .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.ppl{display:inline-flex;align-items:center;gap:4px}
.prow{padding:13px 10px}

/* ---------- ajustes visuales v2 ---------- */
/* cabeceras */
.hero{padding:16px 16px 14px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20200%20200%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%270.13%27%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2793%27%20stroke-width%3D%2712%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2768%27%20stroke-width%3D%273%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2746%27%20stroke-width%3D%272%27%2F%3E%3Ccircle%20cx%3D%27100%27%20cy%3D%27100%27%20r%3D%2722%27%20stroke-width%3D%2712%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat right calc(var(--gut) - 64px) top -58px / 190px 190px,linear-gradient(150deg,var(--hero-a) 0%,var(--hero-b) 100%)}
.brand{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.16em;opacity:.85}
.today-head{margin:4px 0 14px}
.today-head h1{font-size:30px;line-height:1.05}
.page-head{background:none;color:var(--ink);margin:6px 0 14px;padding:0;border-radius:0;overflow:visible}
.page-head h1{color:var(--ink);font-size:34px;line-height:1}
.page-head .link-btn{color:var(--accent)}
.wk-head{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
.wk-head .meta{color:var(--muted)}
.wk-head .icon-btn{background:var(--surface-2);color:var(--ink)}
.wk-head .date-in{background:var(--surface);border-color:var(--line);color:var(--ink);color-scheme:inherit}
.wk-head .title-in{color:var(--ink);border-bottom-color:var(--line)}
.wk-head .title-in::placeholder{color:var(--muted);opacity:.8}
/* formas */
.card,.ex,.post,.hist,.day-row,.item{border-radius:16px}
.btn,.pick-trigger,.other-row,.last-card{border-radius:12px}
.in,.txt,.small-in,.date-in,.note-in{border-radius:8px}
.drop-btn{border-radius:8px;border:1px solid var(--line);background:transparent}
.plate{border-radius:8px;border-width:1px}
.seg button[aria-pressed="true"]{box-shadow:none;outline:1px solid var(--line)}
.chip{background:none;padding:0;border-radius:0;font-size:14px;font-weight:500;color:var(--ink)}
.last{gap:3px 14px}
.last-lbl{flex-basis:100%;margin:0;font-size:12.5px}
.hint{background:none;padding:0;margin:8px 0 10px;border-radius:0;font-size:14px;color:var(--muted)}
.hint.up{background:none;color:var(--accent);font-weight:600}
.hint.hold{background:none;color:var(--warn);font-weight:600}
/* tipografía */
.ex-name{font-family:var(--body);font-weight:700;font-size:19px;line-height:1.2;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ex-folded .ex-name{font-size:17px}
.ex-target{font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted);line-height:1.6}
.in{font-family:var(--body);font-size:22px;font-weight:600}
.in::placeholder{opacity:.45}
.set .n{font-family:var(--body);font-size:15px;font-weight:600}
.pt-name{font-family:var(--body);font-weight:700;font-size:20px;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.post-title{font-family:var(--body);font-weight:700;font-size:18px;line-height:1.25;margin:12px 0 2px}
.dr-name{font-family:var(--body);font-weight:700;font-size:19px;line-height:1.25}
.h2.sm{font-family:var(--body);font-weight:700;font-size:22px;line-height:1.2}
.h3{font-family:var(--body);font-weight:700;font-size:17px;line-height:1.3;margin:24px 0 10px}
.hist-month{font-family:var(--body);font-weight:700;font-size:15px;color:var(--muted)}
.hist-date b{font-family:var(--body);font-size:24px;font-weight:700}
.cmp-val{font-family:var(--body);font-weight:700;font-size:19px}
.trio b{font-family:var(--body);font-weight:700;font-size:19px}
.delta{font-family:var(--body);font-size:13.5px;font-weight:700}
.ex-preview .num{font-family:var(--body);font-weight:600;font-size:15px}
.wd b{font-family:var(--body);font-size:16px;font-weight:700}
.wk-title h1{font-family:var(--body);font-weight:700;font-size:20px;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.title-in{font-family:var(--body);font-weight:700;font-size:20px}
.session .h2{font-size:40px}
/* series */
.set.cur .n{color:var(--accent);font-weight:800}
.set.cur .in{border-color:var(--accent)}
.set.done .n{color:var(--done)}
.set.just .plate svg{animation:pop .3s ease-out}
/* amigos */
.av{width:40px;height:40px}
.cmp .pos{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;color:var(--muted)}
.cmp .pos.gold{background:var(--plate);color:#1B1300}
.cmp-meta,.cmp .bar{margin-left:84px}
.cmp-row.me{background:var(--accent-soft);margin:0 -16px;padding-left:16px;padding-right:16px;width:calc(100% + 32px)}
.cmp-row.first .bar i{background:var(--accent)}
.post-who strong{font-size:16px;font-weight:700}
.post-pr{margin-top:10px;font-size:14.5px;font-weight:600}
.post-pr .badge{margin:0 4px 0 0}
/* progreso */
.prog-sum{font-size:15px;color:var(--muted);margin:-4px 0 16px}
.prog-sum strong{color:var(--ink)}
.prog-hero{margin-bottom:14px}
.prog-hero b{display:block;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:4px 0 6px}
.prog-hero span{font-size:14px;font-weight:600}
.chart .area{opacity:.3}
.chart .grid{stroke-dasharray:2 5}
.trio{margin-top:10px}
/* navegación */
.nav button[aria-current="page"]::before{display:none}
.nav svg{width:24px;height:24px;padding:3px 14px;border-radius:999px;box-sizing:content-box;transition:background-color .15s}
.nav button[aria-current="page"] svg{background:var(--accent-soft)}
body:not(.focus) .timer{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
/* movimiento */
.btn,.icon-btn,.plate,.prow,.menu-btn,.other-row,.pick-trigger,.cmp-row{transition:transform .1s ease}
.btn:active,.icon-btn:active,.plate:active,.prow:active,.menu-btn:active,.other-row:active,.pick-trigger:active{transform:scale(.97)}
.pr-line,.sum-list .is-pr .nm::after{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

/* ---------- ajustes visuales v3 ---------- */
.home-head{margin:2px 0 16px}
.hh-top{display:flex;align-items:center;justify-content:space-between;min-height:40px;margin-bottom:12px}
.home-head .brand{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.16em;color:var(--ink);opacity:1}
.home-head .brand svg{color:var(--accent)}
.hh-av .av{width:38px;height:38px}
.greet{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.home-head > .meta{margin:4px 0 14px;font-size:15px}
.home-head .wd.is-today{background:var(--surface);border:2px solid var(--ink);color:var(--ink);padding:6px 0 5px}

<script>
/* Hierro · modo demo para la web pública.
   Simula en memoria el almacenamiento compartido (rutina, entrenos, amigos y grupo)
   con datos de ejemplo. Nada sale del navegador y todo se reinicia al recargar. */
(function () {
  'use strict';
  const ME = 'demo-tu';
  const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pick = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  /* ---------- ejercicios usados en la demo ---------- */
  const EX = {
    press_banca: ['Press banca', 'kg', 2.5], remo_barra: ['Remo con barra', 'kg', 2.5], press_militar: ['Press militar', 'kg', 2.5],
    jalon: ['Jalón', 'kg', 2.5], laterales: ['Elevaciones laterales', 'kg/manc.', 1], curl_barra: ['Curl con barra', 'kg', 2.5],
    sentadilla: ['Sentadilla', 'kg', 5], peso_muerto_rumano: ['Peso muerto rumano', 'kg', 5], prensa: ['Prensa', 'kg', 10],
    curl_femoral: ['Curl femoral', 'kg', 5], gemelos: ['Elevación de gemelos', 'kg', 5],
    press_incl_manc: ['Press inclinado con mancuernas', 'kg/manc.', 2], dominadas: ['Dominadas', 'lastre', 2.5],
    remo_mancuerna: ['Remo con mancuerna', 'kg/manc.', 2], fondos: ['Fondos', 'lastre', 2.5], martillo: ['Curl martillo', 'kg/manc.', 2],
    triceps_abajo: ['Extensión de tríceps hacia abajo', 'kg', 2.5]
  };
  /* peso inicial → peso actual (kg) para «tú» */
  const LOAD = {
    press_banca: [70, 77.5], remo_barra: [60, 67.5], press_militar: [40, 45], jalon: [55, 62.5], laterales: [10, 12], curl_barra: [30, 35],
    sentadilla: [90, 100], peso_muerto_rumano: [80, 90], prensa: [160, 190], curl_femoral: [40, 47.5], gemelos: [60, 70],
    press_incl_manc: [26, 30], dominadas: [5, 12.5], remo_mancuerna: [28, 32], fondos: [10, 17.5], martillo: [14, 16], triceps_abajo: [25, 30]
  };
  const it = (ex, sets, lo, hi, rest) => ({ex: ex, sets: sets, lo: lo, hi: hi, rest: rest, ss: ''});
  const DAYS = [
    {id: 'd-torso-a', weekday: 1, name: 'Torso A', items: [it('press_banca', 4, 6, 8, 150), it('remo_barra', 4, 8, 10, 120), it('press_militar', 3, 8, 10, 120), it('jalon', 3, 10, 12, 90), it('laterales', 3, 12, 15, 60), it('curl_barra', 3, 10, 12, 60)]},
    {id: 'd-pierna', weekday: 3, name: 'Pierna', items: [it('sentadilla', 4, 6, 8, 180), it('peso_muerto_rumano', 3, 8, 10, 150), it('prensa', 3, 10, 12, 120), it('curl_femoral', 3, 10, 12, 90), it('gemelos', 4, 12, 15, 60)]},
    {id: 'd-torso-b', weekday: 5, name: 'Torso B', items: [it('press_incl_manc', 4, 8, 10, 120), it('dominadas', 4, 6, 8, 150), it('remo_mancuerna', 3, 10, 12, 90), it('fondos', 3, 8, 10, 90), it('martillo', 3, 10, 12, 60), it('triceps_abajo', 3, 10, 12, 60)]}
  ];
  const WEEKS = 8;
  const roundTo = (v, step) => Math.max(0, Math.round(v / step) * step);

  function sessionFor(dayDef, date, wk, factor, sid, now) {
    const entries = dayDef.items.map(item => {
      const info = EX[item.ex], L = LOAD[item.ex], step = info[2];
      const w = roundTo((L[0] + (L[1] - L[0]) * Math.min(1, wk / (WEEKS - 1))) * factor, step);
      const sets = [];
      if (item.ex === 'press_banca' || item.ex === 'sentadilla') sets.push({w: roundTo(w * 0.5, step), r: 10, t: 'c'});
      for (let k = 0; k < item.sets; k++) {
        const r = Math.max(item.lo - 1, item.hi - k - pick(0, 1));
        sets.push({w: (info[1] === 'lastre' && factor < 0.85) ? 0 : w, r: r});
      }
      return {ex: item.ex, sets: sets, note: ''};
    });
    const dur = pick(52, 74);
    const ts = date.toDateString() === now.toDateString()
      ? now.getTime() - pick(2, 4) * 3600e3
      : new Date(date.getFullYear(), date.getMonth(), date.getDate(), pick(17, 20), pick(0, 59)).getTime();
    return {id: sid, date: iso(date), ts: ts, dayId: dayDef.id, dayName: dayDef.name, durationMin: dur, entries: entries};
  }

  /* entrenos de las últimas semanas para un usuario */
  function history(prefix, plan, factor, skipEvery, includeToday) {
    const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    const out = []; let n = 0;
    for (let wk = 0; wk < WEEKS; wk++) {
      const base = new Date(mon); base.setDate(mon.getDate() - (WEEKS - 1 - wk) * 7);
      plan.forEach(p => {
        const d = new Date(base); d.setDate(base.getDate() + ((p.weekday + 6) % 7));
        if (d > today || (!includeToday && d.getTime() === today.getTime())) return;
        n++; if (skipEvery && n % skipEvery === 0) return;
        out.push(sessionFor(p.day, d, wk, factor, prefix + '-' + n, now));
      });
    }
    return out.sort((a, b) => b.ts - a.ts);
  }

  /* ---------- tablón de amigos (misma estructura que genera la app) ---------- */
  const e1 = (w, r) => (w > 0 && r > 0) ? w * (1 + r / 30) : 0;
  const fmt = n => Number(n).toLocaleString('es-ES', {maximumFractionDigits: 2});
  const KG = u => u === 'kg/lado' ? 'kg/lado' : u === 'kg/manc.' ? 'kg/manc.' : 'kg';
  function setTxt(x, unit) {
    const rp = n => fmt(n);
    if (unit === 'lastre') return x.w ? '+' + fmt(x.w) + ' kg × ' + rp(x.r) : fmt(x.r) + (fmt(x.r) === '1' ? ' rep' : ' reps');
    return fmt(x.w) + ' ' + KG(unit) + ' × ' + rp(x.r);
  }
  const round2 = n => Math.round(n * 100) / 100;
  function buildBoard(alias, sessions, reacts) {
    const asc = sessions.slice().sort((a, b) => a.ts - b.ts), ex = {}, recent = [];
    for (const s of asc) {
      const out = [];
      for (const e of s.entries) {
        const info = EX[e.ex], name = info[0], unit = info[1], key = e.ex;
        const ws = e.sets.filter(x => x.t !== 'c'); let pr = false;
        const modes = unit === 'lastre' ? [['load', ws.filter(x => x.w > 0)], ['bw', ws.filter(x => !x.w)]] : [['load', ws]];
        for (const md of modes) {
          const list = md[1], bw = md[0] === 'bw'; if (!list.length) continue;
          const sc = bw ? Math.max(...list.map(x => x.r || 0)) : Math.max(...list.map(x => e1(x.w, x.r)));
          if (!(sc > 0)) continue;
          const best = bw ? list.reduce((a, x) => x.r > a.r ? x : a) : list.reduce((a, x) => e1(x.w, x.r) > e1(a.w, a.r) ? x : a);
          const o = ex[key] || (ex[key] = {name: name, unit: unit, bw: false, best: null});

async function init(){

  if (!db) { useLocal(); return; }
  if (user) { try { uid = await user.id(); } catch(e){ uid = null; } }
  S.mode = 'db'; S.uid = uid;
  db.collection('board').onSnapshot(snap => {
    S.board = snap.docs.map(d => Object.assign({id: d.id}, clone(d.data())));

  }
  S.boardRef = db.collection('board').doc(uid);
  const rRef = db.doc('data/users/' + uid + '/routine');
  const sCol = rRef.collection('sessions');
  backend.saveRoutine = r => rRef.set(r);
  backend.saveSession = (id, s) => sCol.doc(id).set(s);
  backend.deleteSession = id => sCol.doc(id).delete();
  rRef.onSnapshot(snap => {
    S.routine = snap.exists ? sanitizeRoutine(clone(snap.data())) : null;

  sCol.orderBy('ts', 'desc').limit(1000).onSnapshot(snap => {
    S.sessions = snap.docs.map(d => sanitizeSession(Object.assign({id: d.id}, clone(d.data())))).filter(Boolean);

function useLocal(){

  const persist = () => writeLS('hierro.data', {routine: S.routine, sessions: S.sessions});
  backend.saveRoutine = async r => { S.routine = clone(r); if (!persist()) throw {code:'local'}; };

const KG = unit => unit === 'kg/lado' ? 'kg/lado' : unit === 'kg/manc.' ? 'kg/manc.' : 'kg';
function setTxt(x, unit, long){
  let s;

  if (unit === 'lastre') s = x.w ? '+' + fmt(x.w) + ' kg × ' + rp(x.r) : fmt(x.r) + (fmt(x.r) === '1' ? ' rep' : ' reps');

function suggest(it, last, info){
  const u = (UNITS[info.unit] || UNITS.kg).long;
  const step = info.step || 2.5;
  if (!last || !last.length) return {k:'', t:'Sin registros previos. Objetivo: ' + it.sets + ' × ' + rng(it) + ' reps.'};
  if (info.unit === 'lastre' && last.every(x => !x.w)) {
    const tot = last.reduce((a,x) => a + (x.r || 0), 0);
    if (last.every(x => x.r >= it.hi)) return {k:'up', t:'Llegaste a ' + it.hi + ' reps en todas: toca añadir lastre.'};
    return {k:'', t:'La última vez sumaste ' + fmt(tot) + ' reps. Busca sumar alguna más.'};
  }
  const top = Math.max.apply(null, last.map(x => x.w || 0));
  const atTop = last.filter(x => (x.w || 0) === top);
  const bestR = Math.max.apply(null, atTop.map(x => x.r || 0));
  if (atTop.every(x => x.r >= it.hi)) return {k:'up', t:'Con ' + fmt(top) + ' ' + u + ' llegaste a ' + it.hi + ' en todas: sube a ' + fmt(top + step) + '.'};
  if (bestR < it.lo) return {k:'hold', t:'Con ' + fmt(top) + ' ' + u + ' no llegaste a ' + it.lo + ' reps. Mantén el peso hasta entrar en el rango o baja a ' + fmt(Math.max(0, top - step)) + '.'};
  return {k:'', t:'Con ' + fmt(top) + ' ' + u + ', busca una rep más que la última vez (hiciste ' + fmt(bestR) + ').'};
}
const work = sets => { const w = (sets || []).filter(x => x && x.t !== 'c'); return w.length ? w : []; };
function metricVal(sets, m){

function weekStrip(){

    const mark = sess ? '<i class="wd-ok">' + ICON.check + '</i>' : (day ? '<i class="wd-dot"></i>' : '<i class="wd-none"></i>');
    h += '<button class="wd' + (di === today ? ' is-today' : '') + (di === S.hoyDay ? ' is-sel' : '') + (sess ? ' is-done' : '') + '" data-a="hoy-day" data-d="' + di + '" aria-pressed="' + (di === S.hoyDay) + '" aria-label="' + DAY_FULL[w] + ' ' + d.getDate() + (sess ? ', entreno registrado' : day ? ', entreno previsto' : '') + '">'

function prCheck(i, j){

  const hist = historyFor(e.ex, d.id), prev = [];

  e.sets.forEach((x, k) => { if (k !== j && x.done && x.type !== 'c') prev.push({w: num(x.w) || 0, r: num(x.r) || 0}); });
  if (!prev.length) return null;
  const u = info.unit === 'lastre' ? 'kg' : (UNITS[info.unit] || UNITS.kg).short;
  if (info.unit === 'lastre' && w === 0) {
    const maxR = Math.max(0, ...prev.filter(x => !x.w).map(x => x.r));
    if (maxR > 0 && r > maxR) return {k: 'pr', j: j, t: 'Nueva marca: ' + fmt(r) + ' reps seguidas', d: 'Antes tu máximo era ' + fmt(maxR)};
    return null;
  }
  const maxW = Math.max(...prev.map(x => x.w));
  if (w > maxW) return {k: 'pr', j: j, t: 'Nueva marca: el peso más alto que has movido', d: fmt(w) + ' ' + u + ', antes ' + fmt(maxW)};
  const atReps = prev.filter(x => x.r >= r).map(x => x.w);
  if (atReps.length && w > Math.max(...atReps)) return {k: 'pr', j: j, t: 'Nueva marca: tu mejor serie de ' + fmt(r) + ' reps', d: fmt(w) + ' × ' + fmt(r) + ', antes ' + fmt(Math.max(...atReps)) + ' ' + u + ' a ' + fmt(r) + ' reps o más'};
  const bestE = Math.max(...prev.map(x => e1(x.w, x.r)));
  if (e1(w, r) > bestE + 1e-9) return {k: 'pr', j: j, t: 'Nueva marca de fuerza estimada', d: '1RM estimado ' + fmt1(e1(w, r)) + ' ' + u + ', antes ' + fmt1(bestE)};
  if (hist[0]) {
    const lb = Math.max(...hist[0].sets.map(x => e1(x.w || 0, x.r || 0)));
    if (e1(w, r) > lb + 1e-9) return {k: 'better', j: j, t: 'Mejor que la última vez', d: fmt(w) + ' × ' + fmt(r) + ' frente a tu mejor serie del ' + dateShort(hist[0].s.date)};
  }
  return null;
}

function buildSummary(sess, others, edited){
  const rows = []; let prs = 0, series = 0;
  for (const e0 of sess.entries) {
    const info = exInfo(e0.ex);
    series += e0.sets.length;
    const e = {ex: e0.ex, sets: e0.sets.filter(x => x.t !== 'c')};
    if (!e.sets.length) continue;
    const bw = info.unit === 'lastre' && e.sets.every(x => !x.w);
    const score = sets => bw ? Math.max(...sets.map(x => x.r || 0)) : Math.max(...sets.map(x => e1(x.w, x.r)));
    const prev = others.map(s => { const z = (s.entries || []).find(q => q.ex === e.ex); return {s: s, e: z ? {sets: z.sets.filter(x => x.t !== 'c')} : null}; }).filter(o => o.e && o.e.sets.length);
    const today = score(e.sets);
    const before = prev.filter(o => o.s.ts < sess.ts).sort((a,b) => b.s.ts - a.s.ts)[0];
    const bestPrev = prev.length ? Math.max(...prev.map(o => score(o.e.sets))) : null;
    const isPR = bestPrev != null && today > bestPrev + 1e-9;
    if (isPR) prs++;
    let delta = null;
    if (before) { const p = score(before.e.sets); if (p > 0) delta = (today - p) / p; }
    const best = bw ? e.sets.reduce((a,x) => x.r > a.r ? x : a) : e.sets.reduce((a,x) => e1(x.w, x.r) > e1(a.w, a.r) ? x : a);
    rows.push({name: info.name, best: setTxt(best, info.unit, true), delta: delta, isPR: isPR, first: !before});
  }
  return {title: sess.dayName, dur: sess.durationMin, series: series, rows: rows, prs: prs, edited: edited, date: sess.date};
}

function chartSVG(pts, u){

  }

  const area = pts.length > 1 ? line + ' L' + X(pts[pts.length - 1].x).toFixed(1) + ' ' + (H - B) + ' L' + X(pts[0].x).toFixed(1) + ' ' + (H - B) + ' Z' : '';

  const dots = pts.map(p => '<circle class="dot' + (p.y === best ? ' best' : '') + '" cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + r + '"><title>' + esc(dateShort(p.d)) + ': ' + fmt1(p.y) + '</title></circle>').join('');
  const lbl = '<text x="' + L + '" y="' + (H - 8) + '">' + esc(dateShort(pts[0].d)) + '</text>'

function buildBoard(alias){
  const photoNow = safePhoto(S.routine && S.routine.photo) || (myBoard() && safePhoto(myBoard().photo)) || null;
  if (S.routine && S.routine.shareOff) return {alias: alias, updatedAt: Date.now(), hidden: true, photo: photoNow, reacts: (myBoard() && myBoard().reacts) || {}};
  const asc = S.sessions.filter(x => !x.priv).slice().sort((a,b) => a.ts - b.ts);
  const ex = {}, recent = [];
  for (const s of asc) {
    const out = [];
    for (const e of (s.entries || [])) {
      const info = exInfo(e.ex), key = exKey(e.ex, info.name);
      const ws = e.sets.filter(x => x.t !== 'c');
      let pr = false;
      const modes = info.unit === 'lastre' ? [['load', ws.filter(x => x.w > 0)], ['bw', ws.filter(x => !x.w)]] : [['load', ws]];
      for (const md of modes) {
        const list = md[1], bw = md[0] === 'bw'; if (!list.length) continue;
        const sc = bw ? Math.max(...list.map(x => x.r || 0)) : Math.max(...list.map(x => e1(x.w, x.r)));
        if (!(sc > 0)) continue;
        const best = bw ? list.reduce((a,x) => x.r > a.r ? x : a) : list.reduce((a,x) => e1(x.w, x.r) > e1(a.w, a.r) ? x : a);
        const o = ex[key] || (ex[key] = {name: info.name, unit: info.unit, bw: false, best: null});
        o.name = info.name; o.unit = info.unit;
        const nb = {s: round(sc, 2), w: best.w || 0, r: best.r || 0, set: setTxt(best, info.unit), d: s.date};
        if (best.dr) { nb.dw = best.dw || 0; nb.dr = best.dr; }
        if (bw) {
          const cur = (o.bw ? o.best : o.bwBest);
          if (!cur || sc > cur.s + 1e-9) { pr = pr || !!cur; if (o.bw || !o.best) { o.bw = true; o.best = nb; } else o.bwBest = nb; }
        } else {
          const cur = o.bw ? null : o.best;

            pr = pr || !!cur;
            if (o.bw && o.best) o.bwBest = o.best;
            o.bw = false; o.best = nb;
          }
        }
      }
      out.push({id: e.ex, name: info.name, unit: info.unit, pr: pr, sets: e.sets.map(x => { const o = {w: x.w || 0, r: x.r || 0}; if (x.dr) { o.dw = x.dw || 0; o.dr = x.dr; } if (x.t) o.t = x.t; return o; })});
    }

  }

function notifList(){
  const c = notifCfg(), out = [], today = todayISO();
  if (!S.routine || !S.routine.notif) out.push({id: 'setup', kind: 'setup', ts: 0, title: 'Elige tus avisos', body: 'Puedes ver aquí cuándo te toca entrenar, cuándo un amigo te supera en tus ejercicios favoritos o si llevas días sin entrenar.'});
  if (notifPaused(c)) return out.concat([{id: 'paused-' + c.pauseUntil, kind: 'paused', ts: 0, title: 'Avisos en pausa', body: 'Hasta el ' + dateShort(c.pauseUntil) + '.'}]);
  if (c.train) {
    const day = daysSorted().find(d => d.weekday === new Date().getDay());
    const p = String(c.hour || '18:00').split(':'), at = new Date(); at.setHours(+p[0] || 0, +p[1] || 0, 0, 0);
    const done = S.sessions.some(s => s.date === today), rest = ((S.routine && S.routine.rest) || []).indexOf(today) >= 0, snoozed = (+readLS('hierro.snooze') || 0) > Date.now();
    if (day && !done && !rest && !S.draft && !snoozed && Date.now() >= at.getTime())
      out.push({id: 'train-' + today, kind: 'train', ts: at.getTime(), dayId: day.id, title: 'Hoy toca ' + day.name.toLowerCase() + ' 💪', body: 'Tu rutina está lista: ' + pl(day.items.length, 'ejercicio', 'ejercicios') + '. ¡A por ello!'});
  }
  if (c.idle && !out.some(x => x.kind === 'train') && !S.draft) {
    const last = S.sessions.find(s => !s._pending) || S.sessions[0];
    if (last) {
      const t0 = new Date(); t0.setHours(0, 0, 0, 0);
      const days = Math.round((t0.getTime() - fromISO(last.date).getTime()) / 864e5);
      if (days >= (+c.idleDays || 7)) out.push({id: 'idle-' + last.date, kind: 'idle', ts: fromISO(last.date).getTime() + (+c.idleDays || 7) * 864e5, title: '¿Retomamos?', body: 'Hace ' + days + ' días que no registras un entreno. Tu rutina sigue aquí cuando la necesites.'});
    }
  }
  if (c.overtake) (readLS('hierro.nlog') || []).forEach(n => out.push(n));
  return out.sort((a,b) => b.ts - a.ts);
}
function notifUnread(){ const rd = readLS('hierro.nread') || {}; return notifList().filter(n => n.kind !== 'paused' && !rd[n.id]).length; }
function checkOvertakes(){
  const c = notifCfg();
  if (!c.overtake || notifPaused(c) || S.mode !== 'db' || !S.uid || !S.gotBoard || !S.routine) return;
  const favs = S.routine.favs || []; if (!favs.length) return;
  const G = ligaGroups('all'), snap = readLS('hierro.rank'), next = {}, found = {};
  const since = Date.now() - 3 * 864e5;
  G.keys.forEach(ck => {
    if (favs.indexOf(ck.split('|')[0]) < 0) return;
    const g = G.groups[ck], me = g.find(x => x.m.id === S.uid); if (!me) return;
    const ahead = g.filter(x => x.m.id !== S.uid && (+x.o.best.s || 0) > (+me.o.best.s || 0) + 1e-9);
    next[ck] = ahead.map(x => x.m.id);
    if (!snap || !Object.prototype.hasOwnProperty.call(snap, ck)) return;
    ahead.forEach(x => {
      if (snap[ck].indexOf(x.m.id) >= 0) return;
      if (!x.o.best.d || fromISO(x.o.best.d).getTime() < since) return;
      (found[x.m.id] = found[x.m.id] || {m: x.m, cks: []}).cks.push(ck);
    });
  });
  writeLS('hierro.rank', next);
  const ids = Object.keys(found); if (!ids.length) return;
  let log = readLS('hierro.nlog') || [];
  ids.forEach(who => {
    const f = found[who], id = 'ot-' + who + '-' + todayISO();
    const prev = log.find(n => n.id === id), cks = prev ? Array.from(new Set(prev.cks.concat(f.cks))) : f.cks;
    const names = cks.map(ck => G.label(ck).toLowerCase());
    const list = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' y ' + names[names.length - 1];
    const n = {id: id, kind: 'overtake', ts: Date.now(), who: who, cks: cks, title: String(f.m.alias || 'Un amigo') + ' se ha puesto por delante en ' + list, body: 'Hay un cambio en vuestra comparación de fuerza estimada. Mira las marcas.'};
    log = log.filter(x => x.id !== id).concat([n]);
    if (prev) { const rd = readLS('hierro.nread') || {}; delete rd[id]; writeLS('hierro.nread', rd); }
  });
  writeLS('hierro.nlog', log.slice(-30));
}

const GCHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newGroupCode(){ let c; do { c = ''; for (let i = 0; i < 6; i++) c += GCHARS[Math.floor(Math.random() * GCHARS.length)]; } while ((S.groups || []).some(g => g.code === c)); return c; }

function closeSheet(){ S.sheet = null; renderSheet(); }
async function pickEx(id){
  const sh = S.sheet; if (!sh) return;
  const cat = CAT[id];
  if (sh.ctx === 'dia') {
    if (!S.editRoutine.exercises[id] && cat) S.editRoutine.exercises[id] = {name: cat.name, unit: cat.unit, step: cat.step};
    S.editDay.items.push({ex: id, sets: 3, lo: 8, hi: 12, rest: 90, ss: ''});
  } else {
    if (!lib()[id] && cat) {
      const r = clone(S.routine || {version: 1, exercises: {}, days: []});
      r.exercises = r.exercises || {};
      r.exercises[id] = {name: cat.name, unit: cat.unit, step: cat.step};
      const ok = await safeWrite(() => backend.saveRoutine(clone(r)));
      if (!ok) return;
      S.routine = r;
    }
    addToDraft(id);
  }
  closeSheet(); render();
}
function addToDraft(id){
  const sh = S.sheet;
  if (sh && sh.swap != null && S.draft.entries[sh.swap]) {
    const i = sh.swap, e = S.draft.entries[i];
    const done = e.sets.filter(x => x.done);
    const fresh = {ex: id, sets: Array.from({length: Math.max(1, e.sets.length - done.length)}, blankSet), note: '', showNote: false};
    if (done.length) { e.sets = done; e.open = false; S.draft.entries.splice(i + 1, 0, fresh); }
    else S.draft.entries[i] = fresh;
  } else {
    S.draft.entries.push({ex: id, sets: [blankSet(), blankSet(), blankSet()], note: '', showNote: false});
  }
  saveDraft();
}
async function createEx(){
  const sh = S.sheet; if (!sh) return;
  const name = $('#nx-name').value.trim();
  if (!name) { toast('Ponle un nombre al ejercicio'); $('#nx-name').focus(); return; }
  const unit = $('#nx-unit').value, step = num($('#nx-step').value) || 2.5, group = ($('#nx-group') && $('#nx-group').value) || '';
  const id = slug(name) + '_' + uid4();
  if (sh.ctx === 'dia') {
    S.editRoutine.exercises[id] = {name: name, unit: unit, step: step, group: group};
    S.editDay.items.push({ex: id, sets: 3, lo: 8, hi: 12, rest: 90, ss: ''});
    closeSheet(); render(); return;
  }
  const r = clone(S.routine || {version: 1, exercises: {}, days: []});
  r.exercises = r.exercises || {};
  r.exercises[id] = {name: name, unit: unit, step: step, group: group};
  const ok = await safeWrite(() => backend.saveRoutine(clone(r)));
  if (!ok) return;
  S.routine = r;
  addToDraft(id);
  closeSheet(); render();

/* ---------- temporizador de descanso ---------- */
const T = {end: 0, total: 0, iv: null, flash: false, flashTo: null};
let AC = null;
function ensureAudio(){
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch(e){}
}
function beep(){
  try {
    if (!AC) return;
    const t = AC.currentTime;
    [0, 0.28].forEach(off => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.3, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.2);
      o.connect(g); g.connect(AC.destination);
      o.start(t + off); o.stop(t + off + 0.22);
    });
  } catch(e){}
}
function startTimer(sec, ctx){
  T.ctx = ctx || '';
  T.total = sec; T.end = Date.now() + sec * 1000; T.flash = false;
  clearTimeout(T.flashTo); clearInterval(T.iv);
  T.iv = setInterval(tick, 250); tick();
  writeLS(TKEY, {end: T.end, total: T.total, ctx: T.ctx});
}
function tick(){
  if (T.iv && Date.now() >= T.end) { clearInterval(T.iv); T.iv = null; timerDone(); }
  updateTimerBar();
}
function timerDone(){
  T.flash = true;
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch(e){}
  beep();
}
function stopTimer(){ clearInterval(T.iv); T.iv = null; T.end = 0; T.flash = false; clearTimeout(T.flashTo); writeLS(TKEY, null); updateTimerBar(); }
function updateTimerBar(){
  const el = $('#timer'), running = !!T.iv;
  const show = !!S.draft && (running || T.flash);
  el.hidden = !show;
  document.body.classList.toggle('timer-on', show);
  if (!show) return;
  const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
  $('#t-left').textContent = running ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : '0:00';
  $('#t-lbl').textContent = running ? (T.ctx ? 'Siguiente: ' + T.ctx : 'Descanso') : (T.ctx ? 'Listo. Toca: ' + T.ctx : 'Descanso terminado');
  const pct = running ? (1 - left / Math.max(1, T.total)) * 100 : 100;
  $('#t-fill').style.width = Math.min(100, Math.max(0, pct)) + '%';
  el.classList.toggle('is-done', !running);
}

  e1info: () => { S.sheet = {type: 'e1info'}; renderSheet(); },
  'cmp-detail': el => { S.sheet = {type: 'cmpd', ck: el.dataset.ck, id: el.dataset.id}; renderSheet(); },
  'cmp-open': el => {
    const m = S.board.find(b => b.id === el.dataset.id); if (!m) return;
    const sx = (Array.isArray(m.recent) ? m.recent : []).find(x => x && x.d === el.dataset.d);
    if (sx) S.openPosts[String(m.id) + ':' + String(sx.id || sx.ts)] = true;
    closeSheet(); S.ligaWho = m.id; go('liga');
  },

  react: async el => {
    const mine = myBoard();
    if (!S.boardRef || !mine) { toast('Entra en Amigos con tu nombre para reaccionar'); return; }
    const k = el.dataset.k, r = Object.assign({}, mine.reacts || {});
    if (r[k]) delete r[k]; else r[k] = Date.now();
    const keep = {}; Object.keys(r).sort((a,b) => r[b] - r[a]).slice(0, 200).forEach(x => { keep[x] = r[x]; });
    mine.reacts = keep; render();
    try { await S.boardRef.update({reacts: keep}); } catch(err){ toast('No se ha podido guardar la reacción'); }
  },
  'save-rt': el => {
    const m = S.board.find(b => b.id === el.dataset.m); if (!m) return;
    const src = (Array.isArray(m.recent) ? m.recent : []).find(x => x && (String(m.id) + ':' + String(x.id || x.ts)) === el.dataset.k); if (!src) return;
    openDayEditor(null);
    const r = S.editRoutine, d = S.editDay;
    d.name = String(src.name || 'Entreno') + ' (de ' + String(m.alias || '') + ')';
    (Array.isArray(src.ex) ? src.ex : []).forEach(e => {
      const nm = String(e.name || 'Ejercicio');
      let id = e.id && CAT[e.id] ? e.id : null;
      if (!id) id = Object.keys(CAT).find(k => norm(CAT[k].name) === norm(nm)) || Object.keys(r.exercises).find(k => norm(r.exercises[k].name) === norm(nm)) || (slug(nm) + '_' + uid4());
      if (!r.exercises[id]) r.exercises[id] = CAT[id] ? {name: CAT[id].name, unit: CAT[id].unit, step: CAT[id].step} : {name: nm, unit: UNITS[e.unit] ? e.unit : 'kg', step: 2.5};
      const reps = (e.sets || []).filter(x => x.t !== 'c').map(x => Math.round(+x.r || 0)).filter(Boolean);
      const lo = reps.length ? Math.min(...reps) : 8, hi = reps.length ? Math.max(...reps) : 12;
      d.items.push({ex: id, sets: Math.max(1, Math.min(19, reps.length || 3)), lo: lo, hi: Math.max(lo, hi), rest: 90, ss: ''});
    });
    S.editSnap = ''; render();
    toast('Revisa el día y guárdalo. Los pesos los pones tú al entrenar');
  },
  'see-friend': el => { S.ligaWho = el.dataset.id; go('liga'); },
  'post-toggle': el => { const k = el.dataset.k; S.openPosts[k] = !S.openPosts[k]; render(); },
  exopen: el => { const i = +el.dataset.e; S.draft.entries[i].open = true; saveDraft(); rerenderEntry(i); },
  exfold: el => { const i = +el.dataset.e; S.draft.entries[i].open = false; saveDraft(); rerenderEntry(i); },
  exmenu: el => { S.sheet = {type: 'exmenu', i: +el.dataset.e}; renderSheet(); },
  'ex-swap': () => { const i = S.sheet.i; S.sheet = {type: 'addex', ctx: 'workout', q: '', swap: i}; renderSheet(); },
  'ex-move': el => {
    const i = S.sheet.i, j = i + (+el.dataset.dir), en = S.draft.entries;
    if (j < 0 || j >= en.length) return;
    const t = en[i]; en[i] = en[j]; en[j] = t; saveDraft(); closeSheet(); render();
  },
  'ex-skip': () => {
    const i = S.sheet.i, removed = S.draft.entries.splice(i, 1)[0];
    S.draft.skipped = (S.draft.skipped || []).concat([removed]);
    saveDraft(); closeSheet(); render();
    toast('Ejercicio omitido hoy', 'Deshacer', () => { if (!S.draft) return; S.draft.skipped = (S.draft.skipped || []).filter(x => x !== removed); S.draft.entries.splice(Math.min(i, S.draft.entries.length), 0, removed); saveDraft(); if (S.view === 'workout') render(); });
  },
  'finish-force': () => { closeSheet(); finish(true); },
  'pick-open': el => { S.sheet = {type: 'expick', ctx: el.dataset.ctx, q: ''}; renderSheet(); },
  'pick-ex': el => { if (S.sheet && S.sheet.ctx === 'liga') { S.ligaEx = el.dataset.id; writeLS('hierro.ligaEx', S.ligaEx); } else { S.progEx = el.dataset.id; writeLS('hierro.progEx', S.progEx); } closeSheet(); render(); },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el, ev);
});
function onField(ev){
  const t = ev.target, f = t.dataset && t.dataset.f;
  if (!f) return;
  const v = t.value;
  switch (f) {
    case 'w': case 'r': {
      t.classList.toggle('bad', String(v).trim() !== '' && isNaN(num(v)));
      if (S.draft && String(v).trim() === '') {
        const e0 = S.draft.entries[+t.dataset.e], s0 = e0 && e0.sets[+t.dataset.s];
        if (s0 && s0.done && (f === 'r' || exInfo(e0.ex).unit !== 'lastre')) {
          s0.done = false;
          const row = t.closest('.set'); if (row) { row.classList.remove('done'); const pb = row.querySelector('.plate'); if (pb) { pb.setAttribute('aria-pressed', 'false'); pb.innerHTML = ICON.todo; } }
        }
      } if (!S.draft) return; S.draft.entries[+t.dataset.e].sets[+t.dataset.s][f] = v; saveDraftSoon(); break; }
    case 'dw': case 'dr': { t.classList.toggle('bad', String(v).trim() !== '' && isNaN(num(v))); if (!S.draft) return; const s = S.draft.entries[+t.dataset.e].sets[+t.dataset.s]; if (s.drop) s.drop[f === 'dw' ? 'w' : 'r'] = v; saveDraftSoon(); break; }
    case 'dayname': if (S.draft) { S.draft.dayName = v; saveDraftSoon(); } break;
    case 'prog-ex': S.progEx = v; render(); break;
    case 'liga-ex': S.ligaEx = v; render(); break;
    case 'priv-share': if (S.draft) { S.draft.priv = !t.checked; saveDraftSoon(); } break;
    case 'he-w': case 'he-r': case 'he-dw': case 'he-dr': if (S.sheet && S.sheet.vals) S.sheet.vals[+t.dataset.e][+t.dataset.s][f.slice(3)] = v; break;
    case 'he-dur': if (S.sheet) S.sheet.dur = v; break;
    case 'endtime': if (S.draft) {
      if (!v) { S.draft.endAt = null; } else { const p = v.split(':'), base = fromISO(S.draft.date); base.setHours(+p[0], +p[1], 0, 0); if (base.getTime() > S.draft.startedAt) S.draft.endAt = base.getTime(); else toast('Tiene que ser después de empezar (' + hhmm(new Date(S.draft.startedAt)) + ')'); }
      saveDraftSoon(); } break;
    case 'n-hour': if (v && t.type === 'time' && ev.type === 'change') saveNotif({hour: v}); break;
    case 'n-idle': if (ev.type === 'change') saveNotif({idleDays: +v || 7}); break;
    case 'n-pause': if (ev.type === 'change') { if (!v) saveNotif({pauseUntil: null}); else { const t2 = new Date(); t2.setDate(t2.getDate() + (+v)); saveNotif({pauseUntil: iso(t2)}); } } break;
    case 'pickfilter': if (S.sheet && S.sheet.q !== v) { S.sheet.q = v; const l = $('#picklist'); if (l) l.innerHTML = pickListHTML(); } break;
    case 'note': if (S.draft) { S.draft.entries[+t.dataset.e].note = v; saveDraftSoon(); } break;
    case 'date': if (S.draft && v) { S.draft.date = v; saveDraftSoon(); } break;
    case 'dname': if (S.editDay) S.editDay.name = v; break;
    case 'dwd': if (S.editDay) S.editDay.weekday = +v; break;
    case 'isets': { const ok = /^\s*\d{1,2}\s*$/.test(v) && +v > 0 && +v < 20, it = S.editDay && S.editDay.items[+t.dataset.i]; if (!it) break; it._bad = it._bad || {}; it._bad.sets = !ok; t.classList.toggle('bad', !ok); if (ok) it.sets = +v; break; }
    case 'ireps': {
      const m = String(v).match(/^\s*(\d+)\s*(?:[-–a]\s*(\d+))?\s*$/), it = S.editDay && S.editDay.items[+t.dataset.i]; if (!it) break;
      const ok = !!m && +m[1] > 0 && +(m[2] || m[1]) > 0 && +m[1] <= 100 && +(m[2] || m[1]) <= 100;
      it._bad = it._bad || {}; it._bad.reps = !ok; t.classList.toggle('bad', !ok);
      if (ok) { const lo = +m[1], hi = m[2] ? +m[2] : lo; it.lo = Math.min(lo, hi); it.hi = Math.max(lo, hi); }
      break;
    }
    case 'irest': if (S.editDay) S.editDay.items[+t.dataset.i].rest = +v; break;
    case 'iss': if (S.editDay) S.editDay.items[+t.dataset.i].ss = v; break;
    case 'exfilter': if (S.sheet && S.sheet.q !== v) { S.sheet.q = v; const l = $('#exlist'); if (l) l.innerHTML = exListHTML(); } break;
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', ev => { const t = ev.target; if (t && t.dataset && t.dataset.f === 'import' && t.files && t.files[0]) { readBackup(t.files[0]); t.value = ''; return; } if (t && t.dataset && t.dataset.f === 'photo' && t.files && t.files[0]) { uploadPhoto(t.files[0]); t.value = ''; } });
document.addEventListener('change', onField);
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (ev.key === 'Enter' && t.classList && t.classList.contains('in')) {
    ev.preventDefault();
    const f = t.dataset.f, e = t.dataset.e, si = t.dataset.s;
    const sib = g => document.querySelector('[data-f="' + g + '"][data-e="' + e + '"][data-s="' + si + '"]');
    if (f === 'w' && sib('r')) { sib('r').focus(); return; }
    if (f === 'dw' && sib('dr')) { sib('dr').focus(); return; }
    t.blur();
    if (f === 'r' && S.draft) { const st = S.draft.entries[+e] && S.draft.entries[+e].sets[+si]; if (st && !st.done) toggleSet(+e, +si); }
  }
  if (ev.key === 'Escape' && S.sheet) closeSheet();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); flushOutbox(); } });
const selAll = t => { try { t.setSelectionRange(0, String(t.value).length); } catch(e){ try { t.select(); } catch(e2){} } };
let focusT = null, focusAt = 0;
document.addEventListener('focusin', ev => { const t = ev.target; if (t && t.classList && (t.classList.contains('in') || t.classList.contains('small-in'))) { focusT = t; focusAt = Date.now(); setTimeout(() => selAll(t), 0); } });
['mouseup', 'pointerup', 'touchend', 'click'].forEach(tp => document.addEventListener(tp, ev => { if (ev.target === focusT && Date.now() - focusAt < 600) { if (tp === 'mouseup') ev.preventDefault(); setTimeout(() => selAll(focusT), 0); } }));
window.addEventListener('online', () => { flushOutbox(); if (S.view === 'workout') render(); });
window.addEventListener('offline', () => { if (S.view === 'workout') render(); });
setInterval(() => { if (outbox().length) flushOutbox(); }, 30000);
setInterval(() => { if (S.view === 'hoy' && !S.sheet && S.loaded) { const b = document.querySelector('.bell'); if (b) b.outerHTML = bellHTML(); } }, 60000);
try { history.replaceState({v: S.view}, ''); } catch(e){}
window.addEventListener('popstate', ev => {
  if (S.sheet) { S.sheet = null; renderSheet(); try { history.pushState({v: S.view}, ''); } catch(e){} return; }
  if (S.view === 'dia') { A['dia-cancel'](); if (S.view === 'dia') { try { history.pushState({v: 'dia'}, ''); } catch(e){} } return; }
  go((ev.state && ev.state.v) || 'hoy', {fromPop: true});
});

window.addEventListener('hierro-join', ev => {
  const c = String(ev.detail || '');
  if (S.onbStep || shouldOnboard()) { S.pendingJoin = c; if (!S.onbStep) S.onbStep = 1; renderOnb(); return; }
  S.sheet = {type: 'grpjoin', code: c}; renderSheet();
});
window.addEventListener('hierro-kicked', ev => {
  toast('Ya no perteneces al grupo «' + String(ev.detail || '') + '»');
  if (S.sheet && /^grp/.test(S.sheet.type)) closeSheet();
  render();
  setTimeout(() => { if (!myBoard() && S.myAliasCache && S.boardRef) S.boardRef.set(clone(buildBoard(S.myAliasCache))).catch(() => {}); }, 1500);
});
window.addEventListener('hierro-groups', () => { if (S.sheet && /^grp/.test(S.sheet.type)) renderSheet(); if (S.view === 'liga' || S.view === 'hoy') render(); });
init();
try { restoreTimer(); } catch(e){}
setTimeout(() => flushOutbox(), 2500);
})();
</script>
